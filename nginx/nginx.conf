# included by /etc/nginx/nginx.conf into the *http* context

# Let Nginx re-resolve Docker service DNS so scaling works (multiple IPs for same name)
resolver 127.0.0.11 ipv6=off valid=10s;

# Upstreams (service names from docker-compose)
upstream auth_service     { server auth-service:8000; }
upstream user_service     { server user-service:8000; }
upstream comment_service  { server comment-service:8000; }

# Load-balanced upstream for posts (ready for compose scaling)
upstream post_backends {
    zone post_zone 64k;                # shared LB state
    server post-service:8000 resolve;  # re-resolve service name via Docker DNS
    keepalive 64;                      # reuse upstream connections
}

server {
    listen 80;

    # Gateway health
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Root info
    location = / {
        return 200 "MicroBlogg API Gateway";
        add_header Content-Type text/plain;
    }

    # ---- Explicit health rewrites (avoid 404s) ----
    location = /auth/health     { proxy_pass http://auth_service/health; }
    location = /users/health    { proxy_pass http://user_service/health; }
    location = /posts/health    { proxy_pass http://post_backends/health; }
    location = /comments/health { proxy_pass http://comment_service/health; }

    # ---- API routing ----
    location = /auth     { proxy_pass http://auth_service/auth; }         # avoid 301 on bare /auth
    location = /users    { proxy_pass http://user_service/users; }        # avoid 301 on bare /users
    location = /posts    { proxy_pass http://post_backends/posts; }       # avoid 301 on bare /posts
    location = /comments { proxy_pass http://comment_service/comments; }  # avoid 301 on bare /comments

    location /auth/     { proxy_pass http://auth_service; }
    location /users/    { proxy_pass http://user_service; }
    location /posts/    { proxy_pass http://post_backends; }
    location /comments/ { proxy_pass http://comment_service; }

    # Common proxy headers
    proxy_set_header Host              $http_host;  # preserves :8080 on the client side
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Timeouts (dev-friendly)
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    proxy_redirect off;      # don't rewrite Location headers
    client_max_body_size 2m; # allow JSON bodies comfortably
}
